name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed --line-length 120 .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Check coverage
        run: |
          # lcov's line counters: DA:<line>,<hits>. Anything under the floor is
          # a regression worth looking at before it is merged.
          total=$(grep -c '^DA:' coverage/lcov.info)
          covered=$(grep '^DA:' coverage/lcov.info | grep -cv ',0$')
          percent=$(( covered * 100 / total ))
          echo "Line coverage: $covered/$total ($percent%)"
          if [ "$percent" -lt 80 ]; then
            echo "::error::Line coverage $percent% is below the 80% floor"
            exit 1
          fi

      - name: Check docs
        run: dart doc --dry-run .

      - name: Publish dry run
        run: flutter pub publish --dry-run
