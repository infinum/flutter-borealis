include: package:flutter_lints/flutter.yaml

# Note: this project previously registered the `dart_code_metrics` analyzer
# plugin without depending on it, so none of its rules ever ran. The plugin
# config was removed; re-add it together with the dev_dependency if you want
# those metrics enforced.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "lib/**/*.g.dart"
    - "lib/**/*.freezed.dart"
    - "lib/**/*.gen.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_single_quotes
    # Stand-ins for the metrics rules that mattered most here.
    - always_declare_return_types
    - avoid_returning_null_for_void
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - unnecessary_parenthesis
